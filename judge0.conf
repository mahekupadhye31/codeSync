# Judge0 CE configuration
# Loaded via `source /judge0.conf` in the container entrypoint.
# This file is for the self-hosted Docker stack only — do NOT commit
# secrets here for production; override via environment variables instead.

# ── Data stores (dedicated instances for Judge0, isolated from app) ──────────
export REDIS_HOST=judge0-redis
export REDIS_PORT=6379

export POSTGRES_HOST=judge0-postgres
export POSTGRES_DB=judge0
export POSTGRES_USER=judge0
export POSTGRES_PASSWORD=judge0secret

# ── Authentication ────────────────────────────────────────────────────────────
# All Judge0 API calls must include: X-Auth-Token: local_dev_token
export JUDGE0_AUTHN_HEADER=X-Auth-Token
export JUDGE0_AUTHN_TOKEN=local_dev_token

# ── Execution limits ──────────────────────────────────────────────────────────
export CPU_TIME_LIMIT=5
export MEMORY_LIMIT=128000
export MAX_FILE_SIZE=1024

# ── Security ──────────────────────────────────────────────────────────────────
# Disable outbound network access from sandboxed code
export ENABLE_NETWORK=false
