worker_processes auto;

events {
  worker_connections 4096;
  use epoll;
  multi_accept on;
}

http {
  include      /etc/nginx/mime.types;
  default_type application/octet-stream;

  # ── Access log with upstream timing ────────────────────────────────────────
  log_format upstream_timed
    '$remote_addr - $remote_user [$time_local] '
    '"$request" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent" '
    'upstream=$upstream_addr '
    'upstream_rt=$upstream_response_time '
    'request_time=$request_time';

  access_log /var/log/nginx/access.log upstream_timed;
  error_log  /var/log/nginx/error.log  warn;

  sendfile    on;
  tcp_nopush  on;
  tcp_nodelay on;
  keepalive_timeout 65;
  server_tokens off;

  # ── Gzip ────────────────────────────────────────────────────────────────────
  gzip              on;
  gzip_comp_level   4;
  gzip_min_length   1024;
  gzip_vary         on;
  gzip_proxied      any;
  gzip_types
    application/json
    application/javascript
    text/javascript
    text/css
    text/plain
    image/svg+xml;

  # ── Rate limiting ───────────────────────────────────────────────────────────
  # Production: 20 r/s / burst 40 per IP (OAuth endpoints).
  # Raised to 500 r/s / burst 1000 for load testing: k6 sends all VU traffic
  # from one IP (Docker bridge), which would otherwise trip the per-IP limit.
  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=500r/s;
  limit_req_status 429;

  # ── Backend upstreams ───────────────────────────────────────────────────────
  # API requests: least-connection load balancing across both instances.
  # mark_down after 2 consecutive failures; re-probe every 10 s.
  upstream backend_pool {
    least_conn;
    server backend-1:3001 max_fails=2 fail_timeout=10s;
    server backend-2:3001 max_fails=2 fail_timeout=10s;
    keepalive 32;
  }

  # WebSocket requests: consistent-hash on the room_session cookie so a
  # reconnecting client always lands on the same backend instance (same
  # in-memory WS state, same OT history ring buffer).
  upstream ws_backend_pool {
    hash $cookie_room_session consistent;
    server backend-1:3001 max_fails=2 fail_timeout=10s;
    server backend-2:3001 max_fails=2 fail_timeout=10s;
  }

  upstream frontend {
    server frontend:5173;
  }

  # ── Shared proxy timeouts (must be outside server block) ───────────────────
  proxy_read_timeout    3600s;
  proxy_send_timeout    3600s;
  proxy_connect_timeout 10s;

  server {
    listen 80;
    server_name _;

    # ── Auth routes — rate limited ──────────────────────────────────────────
    location /api/auth {
      limit_req zone=auth_limit burst=1000 nodelay;

      proxy_pass http://backend_pool;
      proxy_http_version 1.1;
      proxy_set_header Connection        "";
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── General API ─────────────────────────────────────────────────────────
    location /api {
      proxy_pass http://backend_pool;
      proxy_http_version 1.1;
      proxy_set_header Connection        "";
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── WebSocket — sticky by room_session cookie ───────────────────────────
    location /ws {
      proxy_pass http://ws_backend_pool;
      proxy_http_version 1.1;
      proxy_set_header Upgrade     $http_upgrade;
      proxy_set_header Connection  "Upgrade";
      proxy_set_header Host        $host;
      proxy_set_header X-Real-IP   $remote_addr;
      proxy_read_timeout 3600s;
    }

    # ── Prometheus scrape endpoint (Docker bridge network only) ────────────
    location /metrics {
      allow 172.16.0.0/12;
      allow 10.0.0.0/8;
      deny  all;

      proxy_pass http://backend_pool;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
    }

    # ── Terminal WebSocket ──────────────────────────────────────────────────
    location ^~ /terminal {
      proxy_pass http://ws_backend_pool;
      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection "Upgrade";
      proxy_set_header Host       $host;
      proxy_set_header X-Real-IP  $remote_addr;
      proxy_read_timeout 3600s;
    }

    # ── Static assets — immutable 1-year cache ─────────────────────────────
    # Vite appends content-hash to filenames so stale-cache is impossible.
    location ~* \.(js|css|woff2?|ttf|eot|png|jpg|jpeg|gif|svg|ico|webp)$ {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      add_header Cache-Control "public, max-age=31536000, immutable";
      expires 1y;
      proxy_cache_bypass $http_upgrade;
    }

    # ── Vite dev server + HMR WebSocket ─────────────────────────────────────
    location / {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade   $http_upgrade;
      proxy_set_header Connection "Upgrade";
      proxy_set_header Host      $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_cache_bypass $http_upgrade;
    }
  }
}
