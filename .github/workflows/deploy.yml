name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Lint & type-check ─────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install server deps
        run: npm ci
        working-directory: server

      - name: Install client deps
        run: npm ci
        working-directory: client

      - name: Build client (catches TS/JSX errors)
        run: npm run build
        working-directory: client

  # ── Integration tests ─────────────────────────────────────────────────────
  test:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: codesync_test
          POSTGRES_USER: codesync
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server deps
        run: npm ci
        working-directory: server

      - name: Run server tests
        working-directory: server
        env:
          DATABASE_URL: postgresql://codesync:testpassword@localhost:5432/codesync_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret
          GITHUB_CLIENT_ID: dummy
          GITHUB_CLIENT_SECRET: dummy
          GITHUB_CALLBACK_URL: http://localhost:3001/api/auth/github/callback
          CLIENT_URL: http://localhost
        run: npm test --if-present

  # ── Build & push Docker images ────────────────────────────────────────────
  build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:${{ github.sha }},ghcr.io/${{ github.repository }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: true
          tags: ghcr.io/${{ github.repository }}/frontend:${{ github.sha }},ghcr.io/${{ github.repository }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy ────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Rolling deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -euo pipefail
            cd /opt/codesync

            git pull origin main
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull

            # ── Rolling restart: keep nginx serving during backend upgrades ──
            wait_healthy() {
              local svc=$1
              local attempts=0
              until [ "$(docker compose ps --status healthy -q "$svc" | wc -l)" -ge 1 ]; do
                attempts=$((attempts + 1))
                if [ "$attempts" -ge 20 ]; then
                  echo "ERROR: $svc did not become healthy after 20 attempts" >&2
                  exit 1
                fi
                sleep 3
              done
              echo "$svc is healthy"
            }

            docker compose up -d --no-deps backend-1
            wait_healthy backend-1

            docker compose up -d --no-deps backend-2
            wait_healthy backend-2

            docker compose up -d --no-deps frontend
            docker image prune -f

            # ── Smoke test ────────────────────────────────────────────────────
            for i in $(seq 1 10); do
              status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/api/health || true)
              if [ "$status" = "200" ]; then
                echo "Health check passed"
                exit 0
              fi
              sleep 2
            done
            echo "ERROR: /api/health did not return 200 after 10 attempts" >&2
            exit 1
