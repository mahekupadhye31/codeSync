version: '3.8'

services:
  # ── App data stores ───────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       codesync
      POSTGRES_USER:     codesync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U codesync"]
      interval: 10s
      timeout:  5s
      retries:  5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test:     ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout:  5s
      retries:  5

  # ── Judge0 CE data stores (isolated from app) ─────────────────────────────
  judge0-postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       judge0
      POSTGRES_USER:     judge0
      POSTGRES_PASSWORD: judge0secret
    volumes:
      - judge0_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U judge0"]
      interval: 10s
      timeout:  5s
      retries:  5

  judge0-redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No auth — only accessible within the Docker network
    volumes:
      - judge0_redis_data:/data
    healthcheck:
      test:     ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout:  5s
      retries:  5

  # ── Judge0 CE execution sandbox ───────────────────────────────────────────
  # privileged: true is required for isolate (cgroups + namespaces sandboxing).
  # On first start Judge0 runs db:create + db:migrate; allow ~60 s before
  # marking it healthy.
  judge0-server:
    image: judge0/judge0:1.13.0
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      - "2358:2358"
    privileged: true
    restart: unless-stopped
    depends_on:
      judge0-postgres:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl -sf -H 'X-Auth-Token: local_dev_token' http://localhost:2358/system_info || exit 1"
      interval: 30s
      timeout:  10s
      retries:  5
      start_period: 60s

  # Two workers consume the Judge0 execution queue in parallel.
  # Command runs `bundle exec rails resque:work` via the helper script.
  judge0-workers:
    image: judge0/judge0:1.13.0
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    environment:
      REDIS_HOST: judge0-redis
      REDIS_PORT: 6379
    privileged: true
    restart: unless-stopped
    depends_on:
      judge0-server:
        condition: service_healthy
    deploy:
      replicas: 2

  # ── Backend instances (two for load-balanced deploy) ──────────────────────
  backend-1:
    build:
      context:    ./server
      dockerfile: Dockerfile
    container_name: backend-1
    restart: unless-stopped
    environment:
      NODE_ENV:              ${NODE_ENV:-production}
      PORT:                  3001
      INSTANCE_ID:           backend-1
      DATABASE_URL:          postgresql://codesync:${POSTGRES_PASSWORD}@postgres:5432/codesync
      REDIS_URL:             redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET:            ${JWT_SECRET}
      GITHUB_CLIENT_ID:      ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET:  ${GITHUB_CLIENT_SECRET}
      GITHUB_CALLBACK_URL:   ${GITHUB_CALLBACK_URL}
      CLIENT_URL:            ${CLIENT_URL}
      JUDGE0_API_URL:        ${JUDGE0_API_URL:-http://judge0-server:2358}
      JUDGE0_AUTH_TOKEN:     ${JUDGE0_AUTH_TOKEN:-local_dev_token}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:          ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/health || exit 1"]
      interval:      30s
      timeout:       5s
      retries:       3
      start_period:  30s
    volumes:
      - ./server/src:/app/src

  backend-2:
    build:
      context:    ./server
      dockerfile: Dockerfile
    container_name: backend-2
    restart: unless-stopped
    environment:
      NODE_ENV:              ${NODE_ENV:-production}
      PORT:                  3001
      INSTANCE_ID:           backend-2
      DATABASE_URL:          postgresql://codesync:${POSTGRES_PASSWORD}@postgres:5432/codesync
      REDIS_URL:             redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET:            ${JWT_SECRET}
      GITHUB_CLIENT_ID:      ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET:  ${GITHUB_CLIENT_SECRET}
      GITHUB_CALLBACK_URL:   ${GITHUB_CALLBACK_URL}
      CLIENT_URL:            ${CLIENT_URL}
      JUDGE0_API_URL:        ${JUDGE0_API_URL:-http://judge0-server:2358}
      JUDGE0_AUTH_TOKEN:     ${JUDGE0_AUTH_TOKEN:-local_dev_token}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:          ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/health || exit 1"]
      interval:      30s
      timeout:       5s
      retries:       3
      start_period:  30s
    volumes:
      - ./server/src:/app/src

  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    build:
      context:    ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_URL:     ${VITE_API_URL:-/api}
      VITE_WS_URL:      ${VITE_WS_URL:-ws://localhost/ws}
      HMR_CLIENT_PORT:  80
    ports:
      - "5173:5173"
    volumes:
      - ./client/src:/app/src
    depends_on:
      - backend-1

  # ── Nginx reverse proxy & load balancer ───────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_healthy
      frontend:
        condition: service_started

  # ── Observability ─────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.47.0
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    depends_on:
      - backend-1
      - backend-2

  grafana:
    image: grafana/grafana:10.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP:     "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/codesync.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  judge0_postgres_data:
  judge0_redis_data:
  prometheus_data:
  grafana_data:
