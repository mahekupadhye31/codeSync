global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'codesync-backend'
    static_configs:
      - targets:
          - 'backend-1:3001'
          - 'backend-2:3001'
    metrics_path:    '/metrics'
    scrape_interval: 10s
    relabel_configs:
      - source_labels: [__address__]
        target_label:  instance
        regex:         '(backend-[12]):3001'
        replacement:   '$1'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
